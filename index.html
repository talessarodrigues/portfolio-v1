<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <!-- As fontes vêm do Google (ver src/index.css). Abrir a conexão aqui,
         antes do CSS ser lido, tira ~300ms do primeiro texto na tela. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- SEO e prévia de link. Cada tag fica numa linha só de propósito: o
         build gera uma cópia deste HTML para /sobre e para cada case com
         título, descrição e imagem próprios (ver plugin seoPages em
         vite.config.ts), trocando estas linhas. -->
    <title>Talessa Rodrigues | Product Designer &amp; AI Engineer</title>
    <meta name="description" content="Product Designer &amp; AI Engineer. From discovery to a live product: UX/UI, design systems and AI-assisted development focused on the user experience." />
    <meta name="author" content="Talessa Rodrigues" />
    <meta name="keywords" content="Talessa Rodrigues, product designer, AI engineer, UX designer, UI designer, UX/UI, design system, AI-assisted development, LLM integration, A/B testing, growth design, UX portfolio, Next.js, React, Brazil" />

    <!-- max-image-preview:large libera a miniatura grande nos resultados do
         Google, que é o que faz o card do portfólio se destacar na busca. -->
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="https://www.talessarodriguesdesign.com.br/" />

    <!-- O site é só escuro: a barra do navegador no celular acompanha, e o
         data-theme do <html> já liga os tokens escuros antes do JS rodar
         (sem flash de tela clara). -->
    <meta name="theme-color" content="#07070C" />
    <meta name="color-scheme" content="dark" />

    <!-- Cartão de compartilhamento (WhatsApp, LinkedIn, Instagram, Slack).
         A imagem é 1200×630 e é gerada por scripts/og-images.mjs; o que
         importa fica no centro, porque o WhatsApp corta a prévia pequena
         num quadrado. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Talessa Rodrigues · Product Designer &amp; AI Engineer" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="pt_BR" />
    <meta property="og:locale:alternate" content="es_ES" />
    <meta property="og:url" content="https://www.talessarodriguesdesign.com.br/" />
    <meta property="og:title" content="Talessa Rodrigues | Product Designer &amp; AI Engineer" />
    <meta property="og:description" content="UX/UI, design systems and AI-built products, from discovery to deployment. See the case studies and get in touch." />
    <meta property="og:image" content="https://www.talessarodriguesdesign.com.br/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:alt" content="Talessa Rodrigues, Product Designer &amp; AI Engineer: portfolio with UX/UI case studies and AI-built products." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Talessa Rodrigues | Product Designer &amp; AI Engineer" />
    <meta name="twitter:description" content="UX/UI, design systems and AI-built products, from discovery to deployment. See the case studies and get in touch." />
    <meta name="twitter:image" content="https://www.talessarodriguesdesign.com.br/og-image.jpg" />
